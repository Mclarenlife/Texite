name: Package desktop preview
on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/*runtime*'
      - 'tests/*compiler*'
      - 'tests/offline-compatibility.test.mjs'
      - 'tests/fixtures/offline/**'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm runtime:prepare
      - run: pnpm exec install-electron
      - run: pnpm test
      - run: pnpm dist:win
        if: runner.os == 'Windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: pnpm dist:mac
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Texite-${{ runner.os }}-preview
          path: |
            release/*.exe
            release/*.dmg
          retention-days: 7
