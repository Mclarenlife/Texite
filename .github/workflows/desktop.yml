name: Package desktop preview
on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/*runtime*'
      - 'scripts/pack-tectonic.py'
      - 'apps/desktop/**'
      - 'tests/*compiler*'
      - 'tests/optional-engines.test.mjs'
      - 'tests/runtime-manager.test.mjs'
      - 'tests/offline-compatibility.test.mjs'
      - 'tests/fixtures/offline/**'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm runtime:prepare
      - run: python scripts/prepare-runtime.py
      - run: python scripts/pack-tectonic.py
      - run: pnpm exec install-electron
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Texite-${{ runner.os }}-compile-diagnostics
          path: .qa/**/*.log
          retention-days: 7
      - run: pnpm dist:win
        if: runner.os == 'Windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Test builds use an ad-hoc signature. Developer ID signing and notarization
      # still need Apple credentials before public distribution.
      - run: pnpm runtime:verify && pnpm build && pnpm exec install-electron && pnpm exec electron-builder --mac dmg --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify and launch macOS test package
        if: runner.os == 'macOS'
        run: |
          APP="$(find release -maxdepth 2 -type d -name 'Texite.app' -print -quit)"
          test -n "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP"
          TEXITE_TEST_EXECUTABLE="$PWD/$APP/Contents/MacOS/Texite" node scripts/smoke-sync-desktop.cjs
          TEXITE_TEST_EXECUTABLE="$PWD/$APP/Contents/MacOS/Texite" node scripts/smoke-navigation-desktop.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: Texite-${{ runner.os }}-preview
          path: |
            release/*.exe
            release/*.dmg
          retention-days: 7
