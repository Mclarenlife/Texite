name: Package desktop preview
on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/*runtime*'
      - 'scripts/pack-tectonic.py'
      - 'apps/desktop/**'
      - 'tests/*compiler*'
      - 'tests/optional-engines.test.mjs'
      - 'tests/runtime-manager.test.mjs'
      - 'tests/offline-compatibility.test.mjs'
      - 'tests/fixtures/offline/**'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm runtime:prepare
      - run: python scripts/prepare-runtime.py
      - run: python scripts/pack-tectonic.py
      - run: pnpm exec install-electron
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Texite-${{ runner.os }}-compile-diagnostics
          path: .qa/**/*.log
          retention-days: 7
      - run: pnpm dist:win
        if: runner.os == 'Windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: pnpm dist:mac
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Texite-${{ runner.os }}-preview
          path: |
            release/*.exe
            release/*.dmg
            release/engine-packs/*.zip
            release/engine-packs/*.json
          retention-days: 7
