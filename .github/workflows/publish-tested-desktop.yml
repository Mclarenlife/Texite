name: Publish verified desktop installers
on:
  workflow_dispatch:
    inputs:
      desktop_run:
        description: Successful Package desktop run ID
        required: true
      validation_run:
        description: Successful Validate run ID for the same commit
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-tested-desktop
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DESKTOP_RUN: ${{ inputs.desktop_run }}
      VALIDATION_RUN: ${{ inputs.validation_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify tested builds, upload installers and publish
        run: python scripts/publish-tested-desktop.py
