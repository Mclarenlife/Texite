name: Package and test iOS simulator
on:
  push:
    branches: [codex/ios-alpha]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: |
            .tools/android-busytex
            .tools/tl2025
            .tools/texlive-2025.tlpdb.xz
          key: mobile-tex-2023-2025-v1
      - run: pnpm runtime:prepare
      - run: pnpm android:runtime
      - run: pnpm build:ios
      - run: gem install xcodeproj --user-install --no-document
      - run: ruby scripts/configure-ios-tests.rb
      - run: node scripts/package-ios.mjs > ios-build.log 2>&1
      - name: Run iPhone simulator tests
        shell: bash
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if "iPhone" in d["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project apps/ios/App/App.xcodeproj -scheme App -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath .tools/ios-build -resultBundlePath release/ios/iPhone-tests.xcresult CODE_SIGNING_ALLOWED=NO test > ios-test.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Texite-iOS-simulator-alpha
          path: |
            release/ios/
            ios-build.log
            ios-test.log
          retention-days: 14
